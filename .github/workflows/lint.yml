name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax + shellcheck (all repo shell scripts)
        run: |
          for f in setup.sh scripts/*.sh; do
            bash -n "$f"
          done
          shellcheck -x setup.sh scripts/*.sh

      - name: Plist template is valid XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('scripts/com.omlx.flash8slot.plist.in'); print('plist XML OK')"

      - name: Python battery compiles
        run: python3 -m py_compile scripts/*.py && echo "py compile OK"

      - name: Dual-cold projection self-test
        run: python3 scripts/guard_dual_cold.py --self-test

      - name: Streaming SHA256 self-test
        run: python3 scripts/sha256_file.py --self-test

      - name: Warm harness refuses protected receipts
        run: |
          if python3 scripts/warm-8slot.py --out results/warm_8slot_results.json; then
            echo "FAIL: should refuse warm_8slot_results.json" >&2
            exit 1
          fi
          if python3 scripts/warm-8slot.py --out results/hot_cache_current.json; then
            echo "FAIL: should refuse hot_cache_*.json" >&2
            exit 1
          fi
          echo "warm --out refuse OK"

      - name: Receipt append-only guard
        run: python3 scripts/receipt_guard.py --self-test

      - name: Results schema
        run: python3 scripts/check-results.py

      - name: Personal-pattern scrub guard
        run: bash scripts/check-scrub.sh

      - name: Docs drift (hot/MTP/mc/oMLX/HF rev)
        run: python3 scripts/check-docs-drift.py

# CI is syntax / schema / scrub / self-test. It does not run oMLX or Metal.
